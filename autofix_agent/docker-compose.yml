services:
  autofix-agent:
    # 构建上下文是仓库根目录：requirements.txt 在根目录，镜像里只拷 autofix_agent/
    build:
      context: ..
      dockerfile: autofix_agent/Dockerfile
    container_name: autofix-agent-service
    ports:
      - "8000:8000"
    volumes:
      # .env 不进镜像，运行时挂载；core/config 会从 /app 向上找到它
      - ../.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
